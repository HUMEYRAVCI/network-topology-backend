version: '3.8'

services:
  network-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    user: root
    container_name: network_topology_db
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Password123!
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - topology-net

  network-api:
    build:
      context: .
      dockerfile: ./NetworkTopologyTracker.Api/Dockerfile
    container_name: network_topology_api
    ports:
      - "5278:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=network-db,1433;Database=NetworkTopologyDb;User Id=sa;Password=YourStrong@Password123!;TrustServerCertificate=True;
    depends_on:
      - network-db
    networks:
      - topology-net

volumes:
  sql_data:

networks:
  topology-net:
    driver: bridge